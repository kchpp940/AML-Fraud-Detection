data:
  source_path: "notebook/data/HI-Small_Trans.csv"
  sample_size: 50000
  test_size: 0.2
  random_state: 42

features:
  target_column: "is_laundering"
  drop_columns:
    - "timestamp"
    - "date"
    - "time"
    - "amount_paid"
    - "receiving_currency"
    - "payment_currency"
    - "from_bank"
    - "to_bank"

models:
  selection_metric: "Recall"
  enabled:
    RandomForest: true
    AdaBoost: true
    GradientBoosting: false
    XGBoost: true
  param_grid:
    RandomForest:
      n_estimators: [50, 100, 200]
    AdaBoost:
      n_estimators: [50, 100, 200]
      learning_rate: [0.01, 0.1, 0.5, 1.0]
    GradientBoosting:
      n_estimators: [50, 100, 200]
      learning_rate: [0.01, 0.1, 0.05, 0.001]
    XGBoost:
      n_estimators: [50, 100, 200]
      learning_rate: [0.01, 0.1, 0.05, 0.001]

output:
  artifacts_dir: "artifacts"
  # Workspace configuration controls how training run artifacts are organized.
  # Two modes are available:
  #   - "flat"    : (default) All artifacts go directly into output.artifacts_dir.
  #                 Backward-compatible with the original "artifacts/" layout.
  #   - "batched" : Each training run creates an isolated directory under
  #                 runs/run_YYYYMMDD_HHMMSS/ containing its own artifacts/,
  #                 logs/, and tmp/ subdirectories. A "latest" symlink in
  #                 runs/ always points to the most recent run.
  #
  # Environment override: AML_TRAIN_OUTPUT__WORKSPACE__MODE=batched
  workspace:
    mode: "flat"           # "flat" (default) | "batched"
    root: null             # workspace root directory (default: current working dir)
    run_name: null         # custom run name (default: auto-generated timestamp)
