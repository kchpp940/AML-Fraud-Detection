data:
  source_path: "notebook/data/HI-Small_Trans.csv"
  sample_size: 2000
  test_size: 0.25
  random_state: 42

features:
  target_column: "is_laundering"
  drop_columns:
    - "timestamp"
    - "date"
    - "time"
    - "amount_paid"
    - "receiving_currency"
    - "payment_currency"
    - "from_bank"
    - "to_bank"

models:
  selection_metric: "Recall"
  enabled:
    RandomForest: true
    AdaBoost: true
    GradientBoosting: false
    XGBoost: false
  param_grid:
    RandomForest:
      n_estimators: [20, 50]
    AdaBoost:
      n_estimators: [20, 50]
      learning_rate: [0.1]

output:
  artifacts_dir: "artifacts_smoketest"
