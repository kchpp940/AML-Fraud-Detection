<html>
<head>
<style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #fafbfc; }
    .wrap { max-width: 720px; margin: 0 auto; text-align: center; }
    h1 { color: #222; }
    p { color: #555; line-height: 1.6; }
    .cards { display: flex; gap: 18px; margin-top: 28px; }
    .card {
        flex: 1;
        border: 1px solid #dde3ea;
        border-radius: 10px;
        padding: 20px;
        background: #fff;
        text-decoration: none;
        color: #222;
        transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(40,60,90,.08);
        border-color: #7aa7ff;
    }
    .card .emoji { font-size: 2em; }
    .card .title { font-size: 1.15em; font-weight: bold; margin-top: 8px; color: #06c; }
    .card .desc { margin-top: 6px; color: #666; font-size: .9em; }
</style>
</head>
<body>
<div class="wrap">
    <h1>Anti Money Laundering (AML) Fraud Detection</h1>
    <p>
        本应用基于历史交易数据训练的机器学习模型，对单笔或批量交易进行欺诈风险识别，
        并提供分级风险等级、边际贡献因子解释以及 artifact 完整性校验。
    </p>
    <div class="cards">
        <a class="card" href="/predictdata">
            <div class="emoji">💳</div>
            <div class="title">Single Prediction</div>
            <div class="desc">填写单条交易的 9 个字段，即时返回欺诈预测结果、风险等级与解释。</div>
        </a>
        <a class="card" href="/batchprediction">
            <div class="emoji">📄</div>
            <div class="title">Batch Prediction</div>
            <div class="desc">上传批量 CSV（UTF-8，最多 16MB），返回汇总统计与逐条明细。</div>
        </a>
    </div>
</div>
</body>
</html>
